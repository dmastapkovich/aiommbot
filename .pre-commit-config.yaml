# The checks that run before a commit, and again over the whole tree in CI.
#
# Every remote hook is frozen to a 40-character commit with its version beside
# it, the way astral-sh/ruff (:142) and astral-sh/ty (:115) pin theirs: a tag
# moves, a commit does not. Dependabot rewrites both the commit and the comment.
#
# The repository's own checkers are local hooks in the shape
# koxudaxi/datamodel-code-generator uses for its six (:36-73): the `files:`
# pattern decides WHEN a hook runs, `pass_filenames: false` keeps it from
# deciding what the hook looks at, and the script walks the tree itself. That
# matters here, because an index is a property of a directory rather than of the
# file that changed.
#
# `.agents/scripts/check-diagrams.py` is deliberately absent. It needs a headless
# browser, and a hook that fails on a contributor who has no Chromium teaches
# them to pass --no-verify. It runs in CI, where the browser is installed.

repos:
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: 916ad0aaa108c64d294101002066f530ea170b10  # frozen: v0.23.3
    hooks:
      - id: markdownlint-cli2
        # A research note quotes its sources verbatim, so its list markers, its
        # tabs and its blockquote spacing are somebody else's. Linting the two
        # research directories reports 1922 findings and would teach an author
        # to reformat a quotation. §8 already exempts them from the width rule
        # for the same reason, and `check-docs.py` carries the same two prefixes.
        exclude: ^(docs|\.agents)/research/

  - repo: https://github.com/crate-ci/typos
    rev: 512fc24f32f44ab01972217aaaf3dc86ec234d53  # frozen: v1.50.2
    hooks:
      - id: typos
        # Report, never rewrite. The hook writes its corrections by default, and
        # the first run proved what that costs here: it renamed the Mermaid
        # participant `CNA` to `CAN` on one line of docs/design/06-runtime-view.md
        # and left the other three, and `CNB` beside it, alone -- a diagram that
        # no longer declares the participant it draws. A spelling correction in
        # prose full of identifiers is the author's call, not the hook's.
        # `--force-exclude` is what makes [files] extend-exclude of .typos.toml
        # apply when pre-commit passes the file names explicitly.
        args: ["--force-exclude"]

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: fa412071e4f5d44d44f9e365f4676f9df92456a2  # frozen: v1.30.1
    hooks:
      - id: zizmor

  - repo: local
    hooks:
      - id: check-docs
        name: width, relative links and anchors (documentation-style §6, §8)
        entry: python3 .agents/scripts/check-docs.py
        language: system
        files: (\.md$|^\.agents/scripts/.*\.py$)
        pass_filenames: false

      - id: check-index
        name: every document appears in its directory's index (documentation-style §6)
        entry: python3 .agents/scripts/check-index.py
        language: system
        files: (\.md$|^\.agents/scripts/.*\.py$)
        pass_filenames: false
