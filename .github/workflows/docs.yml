# Every check the catalogue owes on a change, except the external link sweep,
# which belongs to link-check.yml because it depends on somebody else's servers.
#
# The hygiene is wemake-services/django-modern-rest's, transcribed from its
# .github/workflows/lychee.yml: actions frozen to a commit with the version
# beside it (:22, :27), `persist-credentials: false` on the checkout (:24), the
# smallest permissions (:14-15), and a concurrency group that cancels a
# superseded run without letting two pushes to main cancel each other (:10-12).
#
# No `paths:` filter. A '**/*.md' filter would skip CI on exactly the changes
# that most need it: the seventeen tracked files that are not Markdown are the
# linting machinery itself -- the four checkers, these two workflows and the four
# tool configurations -- and `.pre-commit-config.yaml` gates the checkers on
# `^\.agents/scripts/.*\.py$` for that reason. The two purest documentation
# repositories in the reference corpus -- prometheus/docs and OWASP/ASVS --
# likewise trigger without a paths filter (md-validation.yml:3-4,
# markdown-linter.yml:3-8), though both then narrow scope inside the tool rather
# than at the trigger: OWASP with `files: './5.0*'` and prometheus/docs with a
# single file in Makefile:2, under a TODO to add more.
#
# Two jobs rather than one, so a diagram failure and a lint failure are two
# entries in the checks list. open-telemetry/semantic-conventions takes the same
# shape to its conclusion with fourteen sibling jobs in one file.

name: docs

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Markdown, spelling, links, anchors, indexes
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # One pipeline, not two: the same .pre-commit-config.yaml a contributor
      # installs locally is what runs here, over every file. Thirty-one of the
      # forty-seven reference clones that carry pre-commit re-run it in CI --
      # twenty-six by a workflow, directly or through tox, nox or just, and five
      # more through pre-commit.ci. prek is what the recent adopters run it with:
      # CPython, PEPs, FastAPI, ruff and ty.
      - uses: j178/prek-action@4e14d07f9231acabce116ccfca13b13dd9755ece # v3.0.0

  diagrams:
    name: Mermaid diagrams parse
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0

      # mermaid-cli takes puppeteer as a peer dependency, so this install also
      # pulls puppeteer in and its postinstall downloads the headless browser the
      # renderer drives. That download is what cannot happen in a development
      # sandbox, and the reason this check lives here rather than in
      # .pre-commit-config.yaml.
      - name: Install the Mermaid renderer
        run: npm install --global @mermaid-js/mermaid-cli@11.17.0

      - name: Parse every diagram
        run: python3 .agents/scripts/check-diagrams.py
