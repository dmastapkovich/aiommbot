# Spelling for the prose this catalogue writes.
#
# typos is the spell checker ADR-0011 already chose for this project, and it is
# what the strictness benchmark runs: wemake-services/django-modern-rest pairs
# it with codespell in .pre-commit-config.yaml (:54, :59), as does
# python-trio/trio (:43, :36). Ten of the ninety-three reference clones run it.
#
# The word list is empty on purpose. Django states the discipline a word list
# needs in docs/internals/contributing/writing-documentation.txt:244 -- reword
# the sentence first, and add a word only when it cannot be reworded -- and the
# corpus shows the cost of ignoring it: 603 hand-maintained lines in Django, 597
# in Celery, 426 in aiohttp. A name that belongs to the design belongs in
# CONTEXT.md; this file holds only what the glossary cannot.
#
# typos reads .gitignore, so the `.refs/` clones are skipped without naming them.

[default.extend-words]
# Both entries are names this design fixed, and both were measured: left to
# write, typos renamed them across the catalogue on its first run.
#
# NAM is one of the ten rule areas ADR-0033 fixes -- SOL, PAT, TYP, ASY, ERR,
# NAM, MOD, LOG, DOC, TST -- in the same sentence that says an identifier is
# never renumbered and never reused. typos read it as `NAME` and rewrote
# `ST-NAM-01` in ADR-0033, ADR-0040, §8.4 and components/event.md while leaving
# engineering-style.md, which defines every one of those rules, untouched.
NAM = "NAM"
# CNA is a participant alias in the sequence diagram of §6.8. typos read it as a
# transposition of CAN and renamed it on three lines of a six-line exchange,
# leaving the `participant CNB` beside it -- a diagram drawing a participant it
# no longer declares.
CNA = "CNA"

[files]
# The two research directories are excluded for the reason
# docs/documentation-style.md §8 already gives: a note quotes its sources and
# editing a quotation to satisfy a tool falsifies it. Four misspellings sit
# inside quotation marks in .agents/research/28-arc42-deployment-view-and-cross-
# cutting-concepts.md alone -- "neccessary" at :116, :199 and :763, "refering" at
# :673 -- each one arc42's own text. The same two prefixes are exempt from the
# width rule in `.agents/scripts/check-docs.py` and from markdownlint in
# `.pre-commit-config.yaml`; a note is evidence, and the tools treat it as one.
extend-exclude = ["docs/research/", ".agents/research/"]
